[project]
name = "nhac"
version = "0.1.0"
description = "Nhạc — turn scattered concert footage into a replayable greatest-hits experience."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "aiofiles>=24.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Cloud object storage (Cloudflare R2 / AWS S3). Not needed for the local MVP.
s3 = ["boto3>=1.34"]
# AcoustID fingerprinting also needs the `fpcalc` (Chromaprint) binary on PATH.
acoustid = ["pyacoustid>=1.3"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nhac*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
  "B008",   # FastAPI dependency-injection idiom: Depends() in defaults is intended
  "UP042",  # keep explicit (str, Enum) for broad compatibility over StrEnum
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
