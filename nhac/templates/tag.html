{% extends "base.html" %}
{% block title %}Tag song · {{ app_name }}{% endblock %}
{% block content %}
<a class="backbar backbar--gap" href="/">← Skip for now</a>

<div class="stub">
  <div class="clip-card-top" style="padding: 12px 16px">
    <span class="amber micro-wide">Stub · untagged clip</span>
  </div>
  {% if clip.thumbnail_key %}
  <div class="clip-thumb wide" style="margin: 0; background-image:url('{{ media_url(clip.thumbnail_key) }}')"></div>
  {% endif %}
  <div class="stub-body">
    <h1 class="stub-title">What was<br />this one?</h1>
    <p class="stub-lede serif">Couldn't hear it over the crowd.</p>

    <form action="/clips/{{ clip.id }}/tag" method="post" class="stack">
      <label class="field">
        <span>Artist</span>
        <input name="artist" type="text" required value="{{ clip.manual_artist or '' }}" placeholder="e.g. Phoenix" />
      </label>
      <label class="field">
        <span>Song title</span>
        <input name="title" type="text" required value="{{ clip.manual_title or '' }}" placeholder="e.g. Lisztomania" />
      </label>
      <label class="field">
        <span>Album <span class="dim">(optional)</span></span>
        <input name="album" type="text" placeholder="" />
      </label>
      <button class="btn btn-accent btn-block" type="submit">Stick it on</button>
    </form>
  </div>
</div>
{% endblock %}
